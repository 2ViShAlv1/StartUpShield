[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startupshield-ai"
version = "0.5.0"
description = "MVP risk-monitoring dashboard for startups and SaaS companies"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
# Tests import `from src...`, so put the repo root on sys.path explicitly
# instead of relying on pytest's implicit rootdir insertion.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
